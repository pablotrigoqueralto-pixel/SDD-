    ProductImportRow:
      description: One row of the Sage export (change 08 parses the CSV into this
        shape).
      properties:
        sku:
          maxLength: 50
          minLength: 1
          title: Sku
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        brand_code:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          default: null
          title: Brand Code
        brand_name:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          default: null
          title: Brand Name
        family_code:
          maxLength: 100
          minLength: 1
          title: Family Code
          type: string
        kind:
          $ref: '#/components/schemas/ProductKind'
        list_price:
          anyOf:
          - minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
            type: string
          title: List Price
        cost_price:
          anyOf:
          - minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
            type: string
          - type: 'null'
          default: null
          title: Cost Price
        unit:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          default: null
          title: Unit
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Description
        is_active:
          default: true
          title: Is Active
          type: boolean
      required:
      - sku
      - name
      - family_code
      - kind
      - list_price
      title: ProductImportRow
      type: object
