name: ci

# Runs the same pre-commit hooks developers run locally (they use the project toolchains).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-extras --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - uses: pre-commit/action@v3.0.1

  gate:
    name: all checks
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - run: echo "backend and frontend workflows are required checks on protected branches"
