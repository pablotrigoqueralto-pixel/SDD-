name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'ai-specs/specs/api-spec.yml', 'docker-compose.yml', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'ai-specs/specs/api-spec.yml', 'docker-compose.yml', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: lint, types, unit tests, build, types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Generated API types drift
        run: |
          npx openapi-typescript ../ai-specs/specs/api-spec.yml -o /tmp/schema.d.ts
          diff -u src/api/schema.d.ts /tmp/schema.d.ts

  e2e:
    name: Playwright (desktop + mobile) against the compose stack
    runs-on: ubuntu-latest
    needs: quality
    env:
      E2E_ADMIN_PASSWORD: e2e-admin-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the stack
        working-directory: .
        run: |
          cp .env.example .env
          echo 'AUTH_RATE_LIMIT=1000/minute' >> .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/ready && break
            sleep 4
          done
          docker compose exec -T -e E2E_ADMIN_PASSWORD backend python -m app.tooling.e2e_seed
      - name: Run E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down -v
