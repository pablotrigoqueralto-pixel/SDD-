[project]
name = "quermed-crm-backend"
version = "0.1.0"
description = "Quermed CRM backend API (FastAPI)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "uuid-utils>=0.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "factory-boy>=3.3",
    "ruff>=0.6.9",
    "mypy>=1.13",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "ASYNC",    # async pitfalls
    "S",        # bandit
    "T20",      # no print
    "RUF",      # ruff-specific
    "ANN",      # annotations
]
ignore = [
    "ANN401",   # Any is allowed at third-party boundaries when justified
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]
"alembic/**" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "testcontainers.*", "factory.*", "uuid_utils.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "integration: requires a PostgreSQL instance (Docker)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/infrastructure/db/seed.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
